# Defines the pods, resource requests/limits, and probes.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: topic-repository
  labels:
    app: topic-repository
spec:
  replicas: 1 # Number of replicas - adjust later after talking to the team
  selector:
    matchLabels:
      app: topic-repository
  template:
    metadata:
      labels:
        app: topic-repository
    spec:
      serviceAccountName: ani-f0rum-k8s
      containers:
      - name: topic-repository

        # If you're using Minikube, you can leave the image: topic-repository:latest as it is, but you need to ensure that the image is available to the Minikube cluster. Since Minikube runs a local Kubernetes cluster, it does not automatically have access to Docker images built on your host machine unless you configure it properly.
        # Or just use the image from Docker Hub i think
        image: 4sparkz/topic-repository:latest
        imagePullPolicy: Always

        ports:
          - containerPort: 50062

        # env:
        #   - name: API_TOKEN
        #     valueFrom:
        #       secretKeyRef:
        #         name: ani-f0rum
        #         key: API_TOKEN

        # TODO: Check if this is correct ----------------------------------------

        # Resource Requests and Limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        # The liveness probe checks if the container is still running and healthy.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 60

        # The readiness probe checks if the container is ready to serve traffic.
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 60

        # The startup probe checks if the container has started successfully.
        startupProbe:
          httpGet:
            path: /startup
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 60

---

# Service YAML for topic-repository
apiVersion: v1
kind: Service
metadata:
  name: topic-repository
  labels:
    app: topic-repository
spec:
  type: ClusterIP # Internal service type
  selector:
    app: topic-repository # Matches the app label in the deployment
  ports:
    - name: http
      protocol: TCP
      port: 50062 # Exposed port
      targetPort: 50062 # Port on the container