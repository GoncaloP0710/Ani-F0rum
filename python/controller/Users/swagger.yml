openapi: 3.0.0
info:
  title: "USER REST API"
  description: "An API about users"
  version: "1.0.0"

servers:
  - url: "/api"

components:
  # Schemas used in the API 
  schemas:
    User: # User schema that represents a user
      type: "object"
      required:
        - username
        - password
        - location
        - anime_watched
        - anime_watched_score
        - topics_subscribed
        - messages_sent
        - karma
        - achievements
      properties:
        username:
          type: "string"
        password:
          type: "string"
        location:
          type: "string"
        anime_watched:
          type: "array"
          items:
            type: "string"
        anime_watched_score:
          type: "array"
          items:
            type: "integer"
        topics_subscribed:
          type: "array"
          items:
            type: "string"
        karma:
          type: "integer"
        achievements:
          type: "array"
          items:
             $ref: "#/components/schemas/Achievement"
    Achievement: # Achievement schema that represents a Achievement
      type: "object"
      required: 
        - name
        - description
        - date
        - rarity
      properties:
        name:
          type: "string"
        description:
          type: "string"
        date:
          type: "string"
        rarity:
          type: "string"
          enum: [common, rare, epic, legendary, mythic]
    Anime: #Anime schema that represents an anime
      type: "object"
      required:
        - name
        - genres
        - episodes
        - score
        - aired
        - synopsis
      properties:
        name:
          type: "string"
        genres:
          type: "array"
          items:
            type: "string"
        episodes:
          type: "integer"
        score:
          type: "number"
        aired:
          type: "string"
        synopsis:
          type: "string"
    Topic: # Topic schema that represents a Topic
      type: "object"
      required: 
        - name
        - subscribers
        - publications
      properties:
        name:
          type: "string"
        subscribers:
          type: "array"
          items:
            type: "string"
        publications: 
          type: "array"
          items:
            $ref: "#/components/schemas/Publication"
    Publication: # Publication schema that represents a Publication
      type: "object"
      required: 
        - name
        - topic_name
      properties:
        name:
          type: "string"
        topic_name:
          type: "string"
        message:
          $ref: "#/components/schemas/Message"
        images: 
          type: "array"
          items:
            $ref: "#/components/schemas/Image"
    Image: # Image schema that represents a Image
      type: "object"
      required: 
        - name
      properties:
        name:
          type: "string"
    Message: # Message schema that represents a message
      type: "object"
      required:
        - username
        - content
      properties:
        username:
          type: "string"
        content:
          type: "string"


  # Parameters for paths 
  parameters:
    user_name:
      name: "user_name"
      description: "Name of the user in question"
      in: path
      required: True
      schema:
        type: "string"
    achievement_name:
      name: "achievement_name"
      description: "Name of the achievement"
      in: path
      required: True
      schema:
        type: "string"


