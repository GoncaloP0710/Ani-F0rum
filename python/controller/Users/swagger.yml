  /user/{user_name}:
    parameters:
      - name: "user_name"
        in: path
        required: true
        description: "Name of the user"
        schema:
          type: "string"
    get:
      operationId: "user_controller.get_user"
      tags:
        - User
      summary: "Get a specific user by username"
      responses:
        "200":
          description: "Successfully retrieved user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: "User not found"

  /user/{user_name}/related_by_anime:
    parameters:
      - name: "user_name"
        in: path
        required: true
        description: "Name of the user"
        schema:
          type: "string"
    get:
      operationId: "user_controller.get_related_by_anime"
      tags:
        - User
      summary: "Show related users to the specific user based on anime watched"
      responses:
        "200":
          description: "Successfully show related users"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/User"
        "404":
          description: "User not found"

 
