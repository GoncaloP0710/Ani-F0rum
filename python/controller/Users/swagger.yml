  /user/all:
    get:
      operationId: "user_controller.all_users"
      tags:
        - User
      summary: "Show all users"
      responses:
        "200":
          description: "Successfully show all users"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/User"
        "404":
