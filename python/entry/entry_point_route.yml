apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: entry-point-route
  namespace: default
spec:
  parentRefs:
    - name: entry-point-gateway  # Link this route to the Gateway
  hostnames:
    - entry-point.local  # Match the hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"  # Route all traffic
      backendRefs:
        - name: entry-point  # Name of your Kubernetes Service
          port: 80           # Port of your Service