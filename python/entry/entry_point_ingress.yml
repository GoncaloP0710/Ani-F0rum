apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: entry-point
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: entry-point
                port:
                  number: 80