apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entry-point-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: entry-point.local  # Replace with your desired hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: entry-point  # Replace with the correct service name
                port:
                  number: 50030  # Replace with the correct port exposed by your service