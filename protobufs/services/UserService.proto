syntax = "proto3";
import "Common/User.proto";

message get_user_Request { // --------------------------> REQUEST FOR GETTING USER BY NAME
    string user_name = 1;
}

message get_user_Response {
    User user = 1;
}

message get_all_users_Request {} // --------------------------> REQUEST FOR GETTING ALL USERS

message get_all_users_Response {
    repeated User users = 1;
}

message users_related_by_anime_Request { // -------------> REQUEST FOR GETTING USERS THAT WATCHED ONE OF THOSE ANIMES
    repeated string anime_names = 1; // All the animes the user has watched and the ones related to them
}

message users_related_by_anime_Response {
    repeated User users = 1;
}

service UserService { // --------------------------> SERVICE FOR USERSERVICE
    rpc GetUser (get_user_Request) returns (get_user_Response);
    rpc GetAllUsers (get_all_users_Request) returns (get_all_users_Response);
    rpc GetUsersRelatedByAnime (users_related_by_anime_Request) returns (users_related_by_anime_Response);
}
