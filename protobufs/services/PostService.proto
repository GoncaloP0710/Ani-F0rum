syntax = "proto3";

message Message {
    string username = 1;
    string content = 2;
}

// Created for the purpose of the users_related_by_message_Request
message related_messages_Request {
    repeated string user_name = 1;
}

// Created for the purpose of the users_related_by_message_Request
message related_messages_Response {
    repeated Message messages = 1;
}

service PostRepository {
    rpc GetMessagesRelatedToUser (related_messages_Request) returns (related_messages_Response);
}