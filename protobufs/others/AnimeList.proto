syntax = "proto3";
import "Common/Anime.proto";

message anime_related_by_genre_Request { // -------------> REQUEST FOR GETTING ANIME RELATED BY GENRE
    string anime_name = 1;
}

message anime_related_by_genre_Response {
    repeated Anime animes = 1;
}

message user_watched_anime_Request { // -------------> REQUEST FOR GETTING ALL ANIMES WATCHED BY A USER
    string user_name = 1;
}

message user_watched_anime_Response {
    repeated Anime animes = 1;
}

service AnimeList { // --------------------------> SERVICE FOR ANIME LIST
    rpc GetAnimeRelatedByGenre (anime_related_by_genre_Request) returns (anime_related_by_genre_Response);
    rpc GetUserWatchedAnime (user_watched_anime_Request) returns (user_watched_anime_Response);
}