syntax = "proto3";

service FeedGenerator{

    rpc GetFeed (FeedRequest) returns (FeedResponse);

    rpc GetTopicFeed (TopicFeedRequest) returns (TopicFeedResponse);
}

message User {
    required string username = 1;
    required string password = 2;
    optional string location = 3;
    repeated Anime animes_watched = 4; 
    repeated int32 anime_watched_score = 5;
    repeated string topics_subscribed = 6;
    repeated Message messages_sent = 7;
    required int32 karma = 8;
    repeated Achievement achievements = 9;
}

message Publication {
    string name = 1;
    string topicname = 2;
    optional Message message = 3;
    optional repated Image images = 4;
}

message Topic {
    string topicname = 1;
    repeated Subscriber subscribers = 2;
    repeated Publication publications = 3;
}

message FeedRequest{
    User user = 1;
}

message FeedResponse{
    repeated Publication feed = 1;
}

message TopicFeedRequest{
    User user = 1;
}

message TopicFeedResponse{
    repeated Topic topic_feed = 1;
}