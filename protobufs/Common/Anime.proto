syntax = "proto3";

enum AnimeGenre {
    ACTION = 0;
    ADVENTURE = 1;
    COMEDY = 2;
    DRAMA = 3;
    FANTASY = 4;
    HORROR = 5;
    MYSTERY = 6;
    ROMANCE = 7;
    SCI_FI = 8;
    THRILLER = 9;
}

message Anime {
    string name = 1;
    repeated AnimeGenre genres = 2;
    int32 episodes = 3;
    float score = 4;
    string aired = 5;
    string synopsis = 6;
}