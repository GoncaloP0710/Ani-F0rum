syntax = "proto3";

service AnimeController {
    rpc GetAnimeList (AnimeRequest) returns (AnimeList);
}

message AnimeRequest {
   string query = 1;
}

message Anime {
    int32 id = 1;
    string title = 2;
    string genre = 3;
    float score = 4;
    int32 episodes = 5;
    string synopsis = 6;
    string aired = 7;
    
}

message AnimeList {
    repeated Anime animes = 1;
}